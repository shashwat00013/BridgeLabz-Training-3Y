<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Switcher</title>
  <link rel="stylesheet" href="Q4_ThemeSwitcher.css">
  <script src="Q4_ThemeSwitcher.js" defer></script>
</head>
<body data-theme="light">
  <main class="container">
    <h1>Theme Switcher</h1>
    <p>Choose a theme to change the page appearance.</p>
    <div class="theme-buttons">
      <button type="button" data-theme-choice="light">Light</button>
      <button type="button" data-theme-choice="dark">Dark</button>
      <button type="button" data-theme-choice="blue">Blue</button>
    </div>
    <p>Current theme: <strong id="currentTheme">light</strong></p>
  </main>
</body>
</html>
