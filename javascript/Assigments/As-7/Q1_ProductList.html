<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Product List Manager</title>
  <link rel="stylesheet" href="Q1_ProductList.css">
  <script src="Q1_ProductList.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Product List Manager</h1>
    <form id="productForm">
      <input id="productInput" type="text" placeholder="Enter product name" required>
      <button type="submit">Add Product</button>
    </form>
    <p class="hint">Click Edit to change a product. Click outside an edited item to save.</p>
    <ul id="productList"></ul>
  </main>
</body>
</html>
