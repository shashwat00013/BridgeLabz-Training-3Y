<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Character Counter</title>
  <link rel="stylesheet" href="Q2_CharacterCounter.css">
  <script src="Q2_CharacterCounter.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Live Character Counter</h1>
    <textarea id="message" maxlength="100" placeholder="Write up to 100 characters..."></textarea>
    <p id="counter" class="counter">100 characters remaining</p>
    <button id="resetButton" type="button">Reset</button>
  </main>
</body>
</html>
