<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Dropdown</title>
  <link rel="stylesheet" href="Q8_CustomDropdown.css">
  <script src="Q8_CustomDropdown.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Custom Dropdown</h1>
    <div class="dropdown" id="dropdown">
      <button id="dropdownButton" type="button" aria-expanded="false">Choose a fruit</button>
      <div id="dropdownOptions" class="options" hidden>
        <button type="button" data-value="Apple">Apple</button>
        <button type="button" data-value="Banana">Banana</button>
        <button type="button" data-value="Mango">Mango</button>
        <button type="button" data-value="Orange">Orange</button>
      </div>
    </div>
  </main>
</body>
</html>
