<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dynamic Object Updater</title>
  <link rel="stylesheet" href="Dynamic_Object_Updater.css" />
</head>
<body>
  <div class="container">
    <h2>Edit User</h2>
    <form id="userForm">
      <label for="name">Name</label>
      <input type="text" id="name" />

      <label for="email">Email</label>
      <input type="email" id="email" />

      <label for="age">Age</label>
      <input type="number" id="age" min="0" />

      <button type="submit">Update</button>
    </form>

    <h3>Current User Object</h3>
    <div id="display"></div>
    <pre id="json"></pre>
  </div>
  <script src="Dynamic_Object_Updater.js"></script>
</body>
</html>
