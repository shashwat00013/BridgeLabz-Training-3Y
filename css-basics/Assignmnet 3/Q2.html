<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My City Map</title>
</head>
<body>

    <h1>My City</h1>

    <!-- loading="lazy" means the map loads only when it is needed/near the visible area -->
    <iframe
        src="https://www.google.com/maps?q=Delhi&output=embed"
        title="Google Map of Delhi"
        width="80%"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
