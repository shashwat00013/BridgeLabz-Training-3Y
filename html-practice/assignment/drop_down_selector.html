<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown Selection Page</title>
</head>

<body>

    <!-- ================= HEADER ================= -->

    <header>
        <h1>Travel Selection Page</h1>
        <p>Select your preferred travel details.</p>
    </header>


    <!-- ================= SELECTION FORM ================= -->

    <main>

        <form>

            <!-- Country Dropdown -->
            <label for="country">
                Country:
            </label>

            <select id="country" name="country">

                <option value="india" selected>
                    India
                </option>

                <option value="usa">
                    United States
                </option>

                <option value="uk">
                    United Kingdom
                </option>

                <option value="japan">
                    Japan
                </option>

            </select>

            <br><br>


            <!-- State Dropdown -->
            <label for="state">
                State:
            </label>

            <select id="state" name="state">

                <option value="madhya-pradesh" selected>
                    Madhya Pradesh
                </option>

                <option value="uttar-pradesh">
                    Uttar Pradesh
                </option>

                <option value="maharashtra">
                    Maharashtra
                </option>

                <option value="rajasthan">
                    Rajasthan
                </option>

            </select>

            <br><br>


            <!-- City Dropdown -->
            <label for="city">
                City:
            </label>

            <select id="city" name="city">

                <option value="bhopal" selected>
                    Bhopal
                </option>

                <option value="indore">
                    Indore
                </option>

                <option value="mathura">
                    Mathura
                </option>

                <option value="mumbai">
                    Mumbai
                </option>

            </select>

            <br><br>


            <!-- Favorite Tourist Place Dropdown -->
            <label for="tourist-place">
                Favorite Tourist Place:
            </label>

            <select id="tourist-place" name="tourist-place">

                <option value="manali" selected>
                    Manali
                </option>

                <option value="goa">
                    Goa
                </option>

                <option value="jaipur">
                    Jaipur
                </option>

                <option value="kerala">
                    Kerala
                </option>

                <option value="ladakh">
                    Ladakh
                </option>

            </select>

        </form>


        <!-- ================= SUMMARY ================= -->

        <p>
            My selected choices are:
            Country - India,
            State - Madhya Pradesh,
            City - Bhopal,
            Favorite Tourist Place - Manali.
        </p>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            &copy; 2026 Travel Selection Page.
            All Rights Reserved.
        </p>

    </footer>

</body>

</html>
