<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTRATION FORM</title>
</head>
<body>
  <form>
    <label for="radio1">Male</label>
    <input type="radio" id="radio1" name="radio1" value="radio1"/>
    <label for="radio2">Female</label>
    <input type="radio" id="radio2" name="radio1" value="radio2"/>
    <label for="radio3">Other</label>
    <input type="radio" id="radio3" name="radio1" value="radio3"/>
    <br/>
    <br/>
    <label for="checkbox1">English</label>
    <input type="checkbox" id="checkbox1" name="checkbox1"/>
     <label for="checkbox2">hindi</label>
    <input type="checkbox" id="checkbox2" name="checkbox2"/>
     <label for="checkbox3">spanish</label>
    <input type="checkbox" id="checkbox3" name="checkbox3"/>
    <br/>
    <br/>
    <label for="file">Upload your file:</label>
    <input type="file" id="file" name="file"/>
    <br/>
    <br/>
    <input type="image" name="image" id="img" src="https://images.unsplash.com/photo-1502082553048-f009c37129b9?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" height="50PX" width="50PX"  />
    <br/>
    <br/>
    <label for="password">Password:</label>
    <input type="password" id="password" placeholder="Enter your password"/>
    <br/>
    <br/>
    <label for="datepicker">Date:</label>
    <input type="date" id="datepicker" name="datepicker"/>
  </form>
</body>
</html>
