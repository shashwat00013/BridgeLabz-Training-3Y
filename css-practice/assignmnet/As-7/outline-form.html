<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outline and Focus Form</title>
  <link rel="stylesheet" href="outline-form.css">
</head>
<body>
  <main class="form-wrap">
    <section class="form-card">
      <p class="eyebrow">Let's connect</p><h1>Send a Message</h1><p>Focus each field to see its outline styling.</p>
      <form action="#" method="post">
        <label for="name">Name</label><input id="name" name="name" type="text" placeholder="Your name" required>
        <label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" required>
        <label for="message">Message</label><textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>
        <button type="submit">Send message</button>
      </form>
    </section>
  </main>
</body>
</html>
