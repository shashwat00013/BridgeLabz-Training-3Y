<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Transformations</title>
  <link rel="stylesheet" href="transformations.css">
</head>
<body>
  <main class="page">
    <header><p class="eyebrow">Move it with CSS</p><h1>Transformations Showcase</h1><p>Hover over each tile to activate its transformation.</p></header>
    <section class="transform-row">
      <figure><div class="transform-box rotate">A</div><figcaption><strong>rotate()</strong><span>Turns the box 12 degrees.</span></figcaption></figure>
      <figure><div class="transform-box scale">B</div><figcaption><strong>scale()</strong><span>Enlarges the box to 1.15 times.</span></figcaption></figure>
      <figure><div class="transform-box translate">C</div><figcaption><strong>translate()</strong><span>Moves the box up and to the right.</span></figcaption></figure>
      <figure><div class="transform-box skew">D</div><figcaption><strong>skew()</strong><span>Slants the box along the X axis.</span></figcaption></figure>
    </section>
  </main>
</body>
</html>
