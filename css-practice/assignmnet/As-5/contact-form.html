<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact-form.css">
</head>
<body>
  <main class="contact-wrapper">
    <section class="contact-card">
      <p class="eyebrow">We'd love to hear from you</p><h1>Contact Us</h1>
      <form action="#" method="post">
        <label for="name">Name</label><input id="name" name="name" type="text" placeholder="Your full name" required>
        <label for="email">Email</label><input id="email" name="email" type="email" placeholder="you@example.com" required>
        <label for="subject">Subject</label><input id="subject" name="subject" type="text" placeholder="How can we help?" required>
        <label for="message">Message</label><textarea id="message" name="message" rows="5" placeholder="Write your message..." required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>
</body>
</html>
