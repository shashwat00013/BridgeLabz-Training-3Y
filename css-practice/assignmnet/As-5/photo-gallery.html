<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="photo-gallery.css">
</head>
<body>
  <main class="gallery-page">
    <header><h1>Places That Inspire</h1><p>A small gallery of landscapes and memorable places.</p></header>
    <section class="gallery" aria-label="Photo gallery">
      <figure><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Mountain lake"><figcaption>Mountain Reflections</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Sunlight over a landscape"><figcaption>Golden Morning</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Sunrise in a green field"><figcaption>First Light</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Snowy mountain peaks"><figcaption>High Peaks</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight through a forest"><figcaption>Quiet Forest</figcaption></figure>
      <figure><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Ocean waves at a beach"><figcaption>Ocean Calm</figcaption></figure>
    </section>
  </main>
</body>
</html>
