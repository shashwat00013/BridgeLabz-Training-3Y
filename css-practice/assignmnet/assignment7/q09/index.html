<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q9 - Outline and Focus Styling</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Outline &amp; Focus Styling</h1>
  </header>

  <main>
    <form class="contact-form">
      <label>
        Name
        <input type="text" class="outline-solid" placeholder="Your name">
      </label>
      <label>
        Email
        <input type="email" class="outline-dashed" placeholder="you@example.com">
      </label>
      <label>
        Message
        <textarea class="outline-dotted" rows="4" placeholder="Your message"></textarea>
      </label>
      <button type="submit">Send Message</button>
    </form>
  </main>
</body>
</html>
