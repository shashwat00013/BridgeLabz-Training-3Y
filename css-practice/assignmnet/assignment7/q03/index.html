<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q3 - Gradient Backgrounds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <h1>Gradient Showcase</h1>
  </header>

  <main>
    <section class="linear-section">
      <h2>Linear Gradient</h2>
      <p>This section uses a linear-gradient that moves diagonally across the background, and stays fixed while you scroll.</p>
    </section>

    <section class="radial-section">
      <h2>Radial Gradient</h2>
      <p>This section uses a radial-gradient that radiates outward from the center of the box.</p>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Gradient Demo</p>
  </footer>
</body>
</html>
