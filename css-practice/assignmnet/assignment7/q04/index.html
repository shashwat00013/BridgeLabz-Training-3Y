<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q4 - Shadows and Depth</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Shadows &amp; Depth</h1>
  </header>

  <main class="card-row">
    <div class="card card-soft">
      <h2>Soft Shadow</h2>
      <p>A subtle, low-spread shadow for a gentle lift.</p>
    </div>
    <div class="card card-hard">
      <h2>Hard Shadow</h2>
      <p>A sharp, offset shadow with no blur.</p>
    </div>
    <div class="card card-glow">
      <h2>Colored Glow</h2>
      <p>A tinted shadow that glows around the card.</p>
    </div>
  </main>
</body>
</html>
