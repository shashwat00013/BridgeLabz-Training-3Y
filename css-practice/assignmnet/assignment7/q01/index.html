<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q1 - Borders and Padding</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Borders &amp; Padding Demonstration</h1>
  </header>

  <main class="box-row">
    <div class="box solid">Solid border<br>padding: 10px</div>
    <div class="box dashed">Dashed border<br>padding: 20px</div>
    <div class="box double">Double border<br>padding: 15px</div>
    <div class="box groove">Groove border<br>padding: 25px</div>
    <div class="box rounded">Rounded corners<br>border-radius: 16px</div>
  </main>

  <footer>
    <p>Hover any box to see the border color transition.</p>
  </footer>
</body>
</html>
