<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q6 - CSS Transformations</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Transformations Showcase</h1>
  </header>

  <main class="transform-row">
    <div class="item">
      <div class="box box-rotate"></div>
      <p>rotate(45deg)</p>
    </div>
    <div class="item">
      <div class="box box-scale"></div>
      <p>scale(1.3)</p>
    </div>
    <div class="item">
      <div class="box box-translate"></div>
      <p>translate(20px, -10px)</p>
    </div>
    <div class="item">
      <div class="box box-skew"></div>
      <p>skew(15deg, 5deg)</p>
    </div>
  </main>
</body>
</html>
