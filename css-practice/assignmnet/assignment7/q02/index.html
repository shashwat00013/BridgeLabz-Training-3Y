<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q2 - Height and Width Practice</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Height &amp; Width Units</h1>
  </header>

  <main class="stage">
    <div class="box box-px">
      Width: 200px<br>Height: 150px
    </div>
    <div class="box box-percent">
      Width: 40%<br>min-height: 120px
    </div>
    <div class="box box-vh">
      Height: 30vh<br>max-width: 250px<br>
      <span class="overflow-note">overflow: auto — this text is long enough to demonstrate scrolling inside a fixed height box.</span>
    </div>
    <div class="box box-em">
      Width: 20em<br>Height: 8em
    </div>
  </main>
</body>
</html>
