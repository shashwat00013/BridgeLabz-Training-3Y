<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Comparison Layout</title>
  <link rel="stylesheet" href="filter-comparison-layout.css">
</head>
<body>
  <header><h1>Image Filter Comparison</h1><p>Compare the original image with a filtered version.</p></header>
  <main>
    <section class="comparison" aria-label="Before and after comparison">
      <figure><img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Natural mountain lake in original colors"><figcaption>Before · Original</figcaption></figure>
      <figure><img class="filtered" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="The same mountain lake with increased contrast"><figcaption>After · Contrast filter</figcaption></figure>
    </section>
  </main>
  <footer><p>Hover over the filtered image to remove its effect.</p></footer>
</body>
</html>
