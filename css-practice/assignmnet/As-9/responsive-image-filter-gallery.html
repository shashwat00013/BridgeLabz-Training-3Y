<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Filter Gallery</title>
  <link rel="stylesheet" href="responsive-image-filter-gallery.css">
</head>
<body>
  <header class="page-header">
    <h1>Image Filter Gallery</h1>
    <p>Explore six CSS image filters. Hover over an image to reveal its original look.</p>
  </header>
  <main>
    <section class="gallery" aria-label="Image filter examples">
      <figure><img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape"><figcaption>Blur</figcaption></figure>
      <figure><img class="grayscale" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80" alt="Lake and mountains"><figcaption>Grayscale</figcaption></figure>
      <figure><img class="sepia" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80" alt="Sunlight through a forest"><figcaption>Sepia</figcaption></figure>
      <figure><img class="brightness" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80" alt="Snowy mountain peaks"><figcaption>Brightness</figcaption></figure>
      <figure><img class="contrast" src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=700&q=80" alt="Mountain lake"><figcaption>Contrast</figcaption></figure>
      <figure><img class="hue" src="https://images.unsplash.com/photo-1472396961693-142e6e269027?auto=format&fit=crop&w=700&q=80" alt="Wild deer in nature"><figcaption>Hue Rotate</figcaption></figure>
    </section>
  </main>
  <footer><p>Responsive CSS Gallery</p></footer>
</body>
</html>
