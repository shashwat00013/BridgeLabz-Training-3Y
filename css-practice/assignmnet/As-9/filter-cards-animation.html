<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Filter Cards with Animation</title>
  <link rel="stylesheet" href="filter-cards-animation.css">
</head>
<body>
  <header><h1>People Behind the Ideas</h1><p>Hover on each card to reveal the original image.</p></header>
  <main>
    <section class="profiles" aria-label="Profile cards">
      <article class="profile"><img class="gray" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80" alt="Portrait of a woman"><div><h2>Alex Morgan</h2><p>Creative Director</p></div></article>
      <article class="profile"><img class="sepia" src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80" alt="Portrait of a man"><div><h2>Jordan Lee</h2><p>Product Designer</p></div></article>
      <article class="profile"><img class="gray" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=600&q=80" alt="Portrait of a woman smiling"><div><h2>Sam Taylor</h2><p>Research Lead</p></div></article>
    </section>
  </main>
  <footer><p>Thoughtful work starts with great people.</p></footer>
</body>
</html>
