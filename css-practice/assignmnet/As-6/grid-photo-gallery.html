<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Photo Gallery</title>
  <link rel="stylesheet" href="grid-photo-gallery.css">
</head>
<body>
  <main class="page"><header><p class="eyebrow">A collection of moments</p><h1>Photo Gallery</h1><p>Hover over a photograph to zoom in.</p></header>
    <section class="gallery" aria-label="Photographs">
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Mountain lake reflecting the sky"></div><figcaption>Mountain Reflections</figcaption></figure>
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Wide open landscape in warm sunlight"></div><figcaption>Golden Fields</figcaption></figure>
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Sun rising over a field"></div><figcaption>First Light</figcaption></figure>
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Mountain peaks"></div><figcaption>High Peaks</figcaption></figure>
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight filtering through forest trees"></div><figcaption>Forest Walk</figcaption></figure>
      <figure><div class="image-frame"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Ocean waves rolling onto a beach"></div><figcaption>Ocean Calm</figcaption></figure>
    </section>
  </main>
</body>
</html>
