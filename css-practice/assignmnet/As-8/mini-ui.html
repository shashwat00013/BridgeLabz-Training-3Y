<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini User Interface</title>
  <link rel="stylesheet" href="mini-ui.css">
</head>
<body>
  <header class="site-header"><a class="logo" href="#home">Daylight</a><nav aria-label="Main navigation"><a href="#home">Home</a><a href="#profile">Profile</a><a href="#contact">Contact</a></nav></header>
  <main id="home" class="main-area">
    <section class="main-card">
      <div class="card-image"><img src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=900&q=80" alt="Bright, modern workspace"></div>
      <div class="card-content" id="profile"><p class="eyebrow">Your workspace</p><h1>Make room for good work.</h1><p>Keep your next idea organised. Add a task, share an update, or send a note to your team.</p>
        <form action="#" method="post"><label for="task-name">Task name</label><input id="task-name" name="task" type="text" placeholder="e.g. Plan this week's goals" required><label for="task-email">Email address</label><input id="task-email" name="email" type="email" placeholder="you@example.com" required><div class="button-row"><button class="primary" type="submit">Save task</button><button class="secondary" type="reset">Clear</button></div></form>
      </div>
    </section>
  </main>
  <footer id="contact">© 2026 Daylight Workspace · Made for focused work.</footer>
</body>
</html>
