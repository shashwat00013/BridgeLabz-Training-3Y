<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Animations</title>
  <link rel="stylesheet" href="css-animations.css">
</head>
<body>
  <main class="animation-page">
    <header><p class="eyebrow">Motion without JavaScript</p><h1>CSS Animation Lab</h1><p>Three animations created with keyframes.</p></header>
    <section class="animation-stage" aria-label="Animation examples">
      <article class="animation-card"><div class="moving-box"></div><h2>Moving Box</h2><p>Slides from side to side.</p></article>
      <article class="animation-card"><div class="ball-track"><div class="ball"></div></div><h2>Bouncing Ball</h2><p>Moves up and down with a delay.</p></article>
      <article class="animation-card"><div class="colour-text">CSS</div><h2>Colour Shift</h2><p>Changes colour in alternating cycles.</p></article>
    </section>
  </main>
</body>
</html>
