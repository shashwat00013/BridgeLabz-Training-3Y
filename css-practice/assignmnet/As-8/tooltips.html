<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Tooltips</title>
  <link rel="stylesheet" href="tooltips.css">
</head>
<body>
  <main class="page">
    <header><p class="eyebrow">Small details, helpful hints</p><h1>CSS Tooltip Gallery</h1><p>Hover or focus each item to reveal its tooltip.</p></header>
    <section class="tooltip-row" aria-label="Tooltip examples">
      <button class="tooltip-item" type="button"><span aria-hidden="true">ⓘ</span><span class="tooltip">More information about this feature.</span><span class="label">Information</span></button>
      <button class="tooltip-item" type="button"><span aria-hidden="true">★</span><span class="tooltip">Save this item to your favourites.</span><span class="label">Favourite</span></button>
      <button class="tooltip-item" type="button"><span aria-hidden="true">✉</span><span class="tooltip">Send us a message for help.</span><span class="label">Contact</span></button>
      <button class="tooltip-item" type="button"><span aria-hidden="true">⚙</span><span class="tooltip">Adjust your display preferences.</span><span class="label">Settings</span></button>
    </section>
  </main>
</body>
</html>
