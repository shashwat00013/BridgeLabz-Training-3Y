<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Showcase</title>
  <link rel="stylesheet" href="image-showcase.css">
</head>
<body>
  <main class="page">
    <header><p class="eyebrow">Explore the world</p><h1>Image Showcase</h1><p>Hover over an image to zoom in and reveal a subtle dark overlay.</p></header>
    <section class="gallery" aria-label="Six photographs">
      <figure><div class="photo"><img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Mountain lake"><span class="overlay"></span></div><figcaption>Mountain Reflections</figcaption></figure>
      <figure><div class="photo"><img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Sunlit landscape"><span class="overlay"></span></div><figcaption>Golden Landscape</figcaption></figure>
      <figure><div class="photo"><img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Sunrise over fields"><span class="overlay"></span></div><figcaption>First Light</figcaption></figure>
      <figure><div class="photo"><img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=900&q=80" alt="Mountain peaks"><span class="overlay"></span></div><figcaption>High Peaks</figcaption></figure>
      <figure><div class="photo"><img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight in a forest"><span class="overlay"></span></div><figcaption>Quiet Forest</figcaption></figure>
      <figure><div class="photo"><img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Ocean waves at the beach"><span class="overlay"></span></div><figcaption>Ocean Calm</figcaption></figure>
    </section>
  </main>
</body>
</html>
