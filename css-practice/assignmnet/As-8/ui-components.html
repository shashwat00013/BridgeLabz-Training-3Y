<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UI Components</title>
  <link rel="stylesheet" href="ui-components.css">
</head>
<body>
  <main class="ui-card">
    <header><p class="eyebrow">Component playground</p><h1>Find what you need</h1><p>Search, choose a category, or start a new action.</p></header>
    <form class="search-form" action="#" method="get"><label class="visually-hidden" for="search">Search resources</label><input id="search" name="q" type="search" placeholder="Search resources..."><button type="submit">Search</button></form>
    <section class="component-section"><h2>Quick actions</h2><div class="action-row"><button class="primary" type="button">Create new</button><button class="secondary" type="button">View activity</button></div></section>
    <section class="component-section"><label for="category">Choose a category</label><select id="category" name="category"><option value="">Select a category</option><option>Design</option><option>Development</option><option>Learning</option><option>Research</option></select></section>
    <footer>Helpful tools, thoughtfully arranged.</footer>
  </main>
</body>
</html>
