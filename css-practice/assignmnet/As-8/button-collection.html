<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Styled Button Collection</title>
  <link rel="stylesheet" href="button-collection.css">
</head>
<body>
  <main class="page">
    <header><p class="eyebrow">Buttons in action</p><h1>Styled Button Collection</h1><p>Hover, press, or focus a button to explore its states.</p></header>
    <section class="button-panel" aria-label="Button styles">
      <article><button class="btn primary" type="button">Primary</button><p>Main call-to-action button.</p></article>
      <article><button class="btn secondary" type="button">Secondary</button><p>Supporting action with a softer fill.</p></article>
      <article><button class="btn outline" type="button">Outline</button><p>Lightweight button with a visible border.</p></article>
      <article><button class="btn disabled" type="button" disabled>Disabled</button><p>Disabled controls cannot be activated.</p></article>
    </section>
  </main>
</body>
</html>
