<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q8 - Photo Gallery (Grid)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="page-title">Photo Gallery</h1>
  <main class="gallery">
    <figure class="photo">
      <div class="img" style="background:#e07a5f"></div>
      <figcaption>Mountain Sunrise</figcaption>
    </figure>
    <figure class="photo">
      <div class="img" style="background:#81b29a"></div>
      <figcaption>Forest Trail</figcaption>
    </figure>
    <figure class="photo">
      <div class="img" style="background:#3d405b"></div>
      <figcaption>City at Night</figcaption>
    </figure>
    <figure class="photo">
      <div class="img" style="background:#f2cc8f"></div>
      <figcaption>Desert Dunes</figcaption>
    </figure>
    <figure class="photo">
      <div class="img" style="background:#5c8aa1"></div>
      <figcaption>Ocean View</figcaption>
    </figure>
    <figure class="photo">
      <div class="img" style="background:#9a8c98"></div>
      <figcaption>Old Town Street</figcaption>
    </figure>
  </main>
</body>
</html>
