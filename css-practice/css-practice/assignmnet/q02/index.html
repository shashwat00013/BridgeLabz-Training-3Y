<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q2 - Product Gallery (Grid)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1 class="page-title">Product Gallery</h1>
  <main class="gallery">
    <div class="card">
      <div class="thumb"></div>
      <h3>Wireless Headphones</h3>
      <p class="price">₹1,999</p>
    </div>
    <div class="card">
      <div class="thumb"></div>
      <h3>Mechanical Keyboard</h3>
      <p class="price">₹3,499</p>
    </div>
    <div class="card">
      <div class="thumb"></div>
      <h3>Smart Watch</h3>
      <p class="price">₹2,799</p>
    </div>
    <div class="card">
      <div class="thumb"></div>
      <h3>Bluetooth Speaker — Portable Edition with extra long description to test equal height</h3>
      <p class="price">₹1,299</p>
    </div>
    <div class="card">
      <div class="thumb"></div>
      <h3>USB-C Hub</h3>
      <p class="price">₹899</p>
    </div>
    <div class="card">
      <div class="thumb"></div>
      <h3>Laptop Stand</h3>
      <p class="price">₹1,099</p>
    </div>
    <div class="card">
      <div class="thumb"></div>
      <h3>Webcam 1080p</h3>
      <p class="price">₹1,599</p>
    </div>
    <div class="card">
      <div class="thumb"></div>
      <h3>Gaming Mouse</h3>
      <p class="price">₹1,199</p>
    </div>
  </main>
</body>
</html>
