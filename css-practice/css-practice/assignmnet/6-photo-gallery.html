<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Gallery</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background-color: #f7f7f9;
    padding: 3rem 1.5rem;
  }

  h1 {
    text-align: center;
    margin-bottom: 2.5rem;
    color: #222;
    font-size: 2rem;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1.2rem;
    max-width: 1100px;
    margin: 0 auto;
  }

  .photo {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    aspect-ratio: 4 / 3;
  }

  .photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.4s ease;
  }

  .photo:hover img {
    transform: scale(1.1);
  }

  .caption {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0));
    color: #fff;
    padding: 1rem 0.9rem 0.6rem;
    font-size: 0.95rem;
    font-weight: 600;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .photo:hover .caption {
    opacity: 1;
  }

  /* Responsive column count */
  @media (max-width: 900px) {
    .gallery { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 520px) {
    .gallery { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<h1>Photo Gallery</h1>

<div class="gallery">

  <div class="photo">
    <img src="https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600" alt="Mountains">
    <div class="caption">Mountain Sunrise</div>
  </div>

  <div class="photo">
    <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=600" alt="Forest">
    <div class="caption">Foggy Forest</div>
  </div>

  <div class="photo">
    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=600" alt="Beach">
    <div class="caption">Golden Beach</div>
  </div>

  <div class="photo">
    <img src="https://images.unsplash.com/photo-1519681393784-d120267933ba?w=600" alt="City">
    <div class="caption">City Lights</div>
  </div>

  <div class="photo">
    <img src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?w=600" alt="Lake">
    <div class="caption">Still Lake</div>
  </div>

  <div class="photo">
    <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?w=600" alt="Desert">
    <div class="caption">Desert Dunes</div>
  </div>

</div>

</body>
</html>
