<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Q5 - Pricing Section (Flexbox)</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pricing">
    <div class="plan">
      <h2>Basic</h2>
      <p class="price">₹199/mo</p>
      <ul>
        <li>1 project</li>
        <li>Community support</li>
        <li>5GB storage</li>
      </ul>
    </div>
    <div class="plan featured">
      <h2>Pro</h2>
      <p class="price">₹499/mo</p>
      <ul>
        <li>Unlimited projects</li>
        <li>Priority support</li>
        <li>50GB storage</li>
      </ul>
    </div>
    <div class="plan">
      <h2>Team</h2>
      <p class="price">₹999/mo</p>
      <ul>
        <li>Everything in Pro</li>
        <li>5 team members</li>
        <li>200GB storage</li>
      </ul>
    </div>
  </main>
</body>
</html>
