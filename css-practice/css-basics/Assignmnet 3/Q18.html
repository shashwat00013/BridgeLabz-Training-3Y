    <h1>Quotations</h1>

    <!-- Long quotation -->
    <blockquote>
        Learning HTML is the first step towards understanding how
        websites are structured and displayed in a web browser.

        My teacher always says, <q>Practice makes perfect &amp; progress.</q>
    </p>
