<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS POSITIONING</title>
  <style>
    div {
      border: 2px solid black;
      height: 8000px;
    }
    .CONTAINER{
    background-color: green;
    height: 8000px;
    }
    img {
      margin: 30px;
    }
    .img1 {
      position: sticky;
      
    }
    .img2 {
      position: relative;
    }
    .img3{
      position: absolute;
      top: 100px;
    }
    .img4{
      position: fixed;
      top: 100px;
    }
    .box{
      position:sticky;
      height:5000px;
      background-color: lightblue;
    }
  
  </style>
</head>

<body>
  <div class="CONTAINER">
    <img src="1.jpg" alt="image1" width="300px" height="300px" class="img1" />
    <img src="2.jpg" alt="image2" Width="300px" height="300px" class="img2" />
    <img src="3.jpg" alt="image3" Width="300px" height="300px" class="img3" />
    <img src="4.jpg" alt="image4" Width="300px" height="300px" class="img4" />
  </div>
  <div class="box">

  </div>
</body>

</html>
