
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Personal-Portfolio.css">
</head>
<body class="bg-light text-dark">
  <header class="bg-dark text-white text-center p-5">
    <div class="container">
      <h1 class="fw-bold">Shashwat Yadav</h1>
      <p class="lead mb-0">Computer Science Student | Aspiring Software Developer</p>
    </div>
  </header>

  <main class="container my-4">
    <section class="portfolio-card text-center p-5 bg-white rounded shadow-sm">
      <!-- img-fluid makes the image responsive; rounded-circle makes it circular -->
      <img
        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=300"
        class="img-fluid rounded-circle profile-img mb-3"
        alt="Profile portrait">

      <h2 class="fw-bold">About Me</h2>
      <p class="mt-3">
        I am a Computer Science student interested in web development,
        problem-solving, and building useful software applications.
      </p>

      <a href="#contact" class="btn btn-primary me-2 mt-2">Hire Me</a>
      <a href="cv.pdf" class="btn btn-outline-dark mt-2" download>Download CV</a>
    </section>

    <section id="contact" class="container my-5">
      <div class="row justify-content-center">
        <div class="col-md-7">
          <h2 class="text-center fw-bold mb-3">Contact Me</h2>
          <form>
            <label for="name" class="form-label">Your Name</label>
            <input type="text" id="name" class="form-control mb-3"
                   placeholder="Enter your name" required>

            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-control mb-3"
                   placeholder="Enter your email" required>

            <label for="message" class="form-label">Message</label>
            <textarea id="message" class="form-control mb-3" rows="4"
                      placeholder="Write your message"></textarea>

            <button type="submit" class="btn btn-primary">Send Message</button>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="text-center bg-dark text-white p-3">
    <p class="mb-0">&copy; 2026 Shashwat Yadav | Portfolio</p>
  </footer>
</body>
</html>
