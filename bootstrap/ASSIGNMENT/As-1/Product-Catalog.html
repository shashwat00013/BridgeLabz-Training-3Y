
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Product-Catalog.css">
</head>
<body>
  <header class="bg-dark text-white p-3">
    <div class="container">
      <h1 class="h3 mb-0">TechStore</h1>
    </div>
  </header>

  <main class="container py-5">
    <h2 class="text-center fw-bold mb-4">Our Products</h2>

    <!-- col-12 = 1 column on mobile, col-sm-6 = 2 on small screens,
         col-md-3 = 4 columns on medium and larger screens -->
    <div class="row g-4">
      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100 shadow-sm">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
               class="card-img-top" alt="Wireless headphones">
          <div class="card-body">
            <h3 class="h5">Wireless Headphones</h3>
            <p class="text-primary fw-bold">₹1,999</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </article>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100 shadow-sm">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
               class="card-img-top" alt="Smart watch">
          <div class="card-body">
            <h3 class="h5">Smart Watch</h3>
            <p class="text-primary fw-bold">₹2,499</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </article>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100 shadow-sm">
          <img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?w=500"
               class="card-img-top" alt="Headset">
          <div class="card-body">
            <h3 class="h5">Gaming Headset</h3>
            <p class="text-primary fw-bold">₹1,499</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </article>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100 shadow-sm">
          <img src="https://images.unsplash.com/photo-1527864550417-7fd91fc51a46?w=500"
               class="card-img-top" alt="Computer mouse">
          <div class="card-body">
            <h3 class="h5">Wireless Mouse</h3>
            <p class="text-primary fw-bold">₹799</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center p-3">
    <p class="mb-0">© 2026 TechStore. Shop smarter.</p>
  </footer>
</body>
</html>
